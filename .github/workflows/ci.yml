name: CI

# Runs on every pull request targeting main. The single "Build and test" job is
# the required status check enforced by the branch ruleset, so it must keep this
# exact name.
#
# No repository secret is required: everything runs on the GitHub-hosted runner.

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/HomeDaemon.Web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/HomeDaemon.Web

      - name: Type-check, lint, test and build
        run: npm run verify
        working-directory: src/HomeDaemon.Web
