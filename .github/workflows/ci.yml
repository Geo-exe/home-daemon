name: CI

# Runs on every pull request targeting main. The single "Build and test" job is
# the required status check enforced by the branch ruleset, so it must keep this
# exact name.
#
# The job detects which areas a pull request touched and only runs the matching
# suites: the .NET API and web app for `src/**`, the Home Assistant custom
# integration for `custom_components/home_daemon/**`.
#
# No repository secret is required: everything runs on the GitHub-hosted runner.

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed areas
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'src/**'
              - 'tests/HomeDaemon.*/**'
              - 'HomeDaemon.slnx'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - '.github/workflows/ci.yml'
            hacs:
              - 'custom_components/home_daemon/**'
              - 'hacs.json'
              - 'requirements_test.txt'
              - 'tests/home_daemon/**'
              - '.github/workflows/ci.yml'

      - name: Set up .NET
        if: steps.changes.outputs.app == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: steps.changes.outputs.app == 'true'
        run: dotnet restore

      - name: Build
        if: steps.changes.outputs.app == 'true'
        run: dotnet build --configuration Release --no-restore

      - name: Test
        if: steps.changes.outputs.app == 'true'
        run: dotnet test --configuration Release --no-build

      - name: Set up Node
        if: steps.changes.outputs.app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/HomeDaemon.Web/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.app == 'true'
        run: npm ci
        working-directory: src/HomeDaemon.Web

      - name: Type-check, lint, test and build
        if: steps.changes.outputs.app == 'true'
        run: npm run verify
        working-directory: src/HomeDaemon.Web

      - name: Set up Python
        if: steps.changes.outputs.hacs == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install Home Assistant test dependencies
        if: steps.changes.outputs.hacs == 'true'
        run: pip install -r requirements_test.txt

      - name: Test the custom integration
        if: steps.changes.outputs.hacs == 'true'
        run: pytest tests/home_daemon

      - name: Validate with hassfest
        if: steps.changes.outputs.hacs == 'true'
        uses: home-assistant/actions/hassfest@master

      # description, topics and license are repository settings rather than files, so they
      # are not verifiable from the workflow itself. Everything that lives in the repository
      # is validated; dropping the ignore list is a follow-up once the repository metadata
      # and a license file are in place.
      - name: Validate with HACS
        if: steps.changes.outputs.hacs == 'true'
        uses: hacs/action@main
        with:
          category: integration
          ignore: 'description topics license brands'
