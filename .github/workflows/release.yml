name: Release

# Runs when a release tag (for example v1.0.0) is pushed. The tagged commit must
# be on main; then the solution is built and tested, and the container image is
# published to GitHub Container Registry (GHCR).
#
# No repository secret is required: the workflow authenticates with the
# short-lived GITHUB_TOKEN. Application secrets are never stored here, they are
# injected at run time from environment variables on the host.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure the tag is on main
        run: |
          # Works for lightweight and annotated tags alike: resolve the tag to its commit.
          tag_commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "::error title=Refused::Tag $GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME ($tag_commit) is on main."

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  web-test:
    name: Verify web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/HomeDaemon.Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/HomeDaemon.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check, lint, test and build
        run: npm run verify

  hacs-test:
    name: Verify Home Assistant integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install Home Assistant test dependencies
        run: pip install -r requirements_test.txt

      - name: Test the custom integration
        run: pytest tests/home_daemon

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration
          ignore: 'description topics license brands'

  publish-image:
    name: Publish container image
    needs: [build-test, web-test, hacs-test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=HomeDaemon
            org.opencontainers.image.description=Calendar-aware chores scheduler that keeps Home Assistant to-do lists in sync.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub release
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the HACS archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import tempfile
          import zipfile

          version = os.environ["TAG"].removeprefix("v")
          if not version:
              raise SystemExit("The release tag has no version.")

          source = pathlib.Path("custom_components/home_daemon")
          package = pathlib.Path(tempfile.mkdtemp()) / "package"
          shutil.copytree(source, package)

          # The checked-in manifest carries the version of the latest release. The archive
          # that HACS installs is stamped from the tag, so releases do not depend on a
          # manual bump that can drift or be forgotten.
          manifest_path = package / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = version
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          for cache in package.rglob("__pycache__"):
              shutil.rmtree(cache, ignore_errors=True)

          archive = pathlib.Path("home_daemon.zip")
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zip_file:
              for path in sorted(package.rglob("*")):
                  if path.is_file():
                      zip_file.write(path, path.relative_to(package))

          with zipfile.ZipFile(archive) as zip_file:
              names = zip_file.namelist()

          # HACS extracts the archive directly into custom_components/home_daemon, so the
          # files must be at the zip root, not wrapped in a custom_components/ folder.
          assert "manifest.json" in names, names
          assert not any(name.startswith("custom_components/") for name in names), names
          assert not any("__pycache__" in name or name.endswith(".pyc") for name in names), names
          print(f"Built {archive} for version {version}: {len(names)} files")
          PY

      - name: Create release for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; ensuring the HACS archive is attached."
            gh release upload "$GITHUB_REF_NAME" home_daemon.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" home_daemon.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
